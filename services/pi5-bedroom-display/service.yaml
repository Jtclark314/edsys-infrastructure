name: pi5-bedroom-display
description: Native Kodi and butler presentation pilot; live HA transport pending
host: edsys-edge-livingroom
runtime: native-systemd-kodi-gbm-arm64
ports:
  inbound: TCP 8080 authenticated Kodi HTTP; exact HA IPv4 on eth0 only
  local_control: /run/edsys-bedroom-display/control.sock (0600 Unix socket)
volumes:
  - /var/lib/edsys-voice/.kodi (private profile and Plex account state)
  - /var/cache/edsys-bedroom-display
  - /run/edsys-bedroom-display (ephemeral)
environment:
  HOME: /var/lib/edsys-voice
  LANG: C.UTF-8
  XDG_RUNTIME_DIR: existing-edsys-voice-runtime
secrets_required:
  - Native Plex account linking held only in the private Kodi profile
  - Generated endpoint-only Kodi HTTP credential in private Pi/HA configuration
backup:
  location: /var/backups/edsys-bedroom-display
  includes: private profile, package delta, original manifest and CEC configuration
monitoring:
  - systemd unit and bounded local status
  - listeners, HDMI mode, temperature and throttling
  - physical advancing video plus overlay acceptance
restore_notes: Stop/disable display; restore only owned files and preserve later changes. Voice remains separately gated.
owner: Jeremy
display_policy:
  verified_date: 2026-10-19
  gui: 1920x1080 at 60 Hz
  refresh_switch: On start/stop (native value 2)
  whitelist: Progressive 1080p at 23.976-60 Hz; UHD 2160p at 23.976-30 Hz; 13 actual advertised modes
  proof: Two synthetic 30-second UHD24 runs plus a 45-second real Plex Original SDR movie; 22 native/DRM UHD23.976 samples and 24 Plex Direct Play samples without transcoding; owner confirmed smooth picture/sound; original show playing again near saved point with selections retained
  limits: Sustained/high-bitrate, dropped-frame counts, HDR and 4K60 remain separate; real movie return required native UI follow-up rather than proven automatic exact-position restoration; 1080p sources retain native quality
  version_preference: Native remembered per-movie 4K choices selected; one verified duplicate grouped with files/history preserved; saving choices held until owner finishes watching; no global 4K policy or client patch
last_verified: 2026-10-19
