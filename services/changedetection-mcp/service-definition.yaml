ports: [] # No listener or web interface; Codex starts a local stdio subprocess.
volumes:
  - /home/jeremy/.local/share/edsys-changedetection-mcp/releases
  - /home/jeremy/.local/share/edsys-changedetection-mcp/current
  - /home/jeremy/.local/state/edsys-changedetection-mcp/artifacts
environment:
