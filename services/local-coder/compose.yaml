name: edsys-local-coder

services:
  ollama-coder:
    image: ollama/ollama@sha256:020e4134285e2ef4d8fd801234176de3b4faadc992a3eb06c8e66a2f9d4c4ba2
    container_name: ollama-coder
    restart: unless-stopped
    # The shared GPU serves cameras, embeddings, voice, and the desktop.
    cpus: 12
    mem_limit: 48g
    memswap_limit: 48g
    oom_score_adj: 500
    pids_limit: 256
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=256m
    ports:
      - "127.0.0.1:11435:11434"
    networks: [broker]
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_MAX_QUEUE: "4"
      OLLAMA_CONTEXT_LENGTH: "65536"
      OLLAMA_KEEP_ALIVE: 2m
      OLLAMA_LOAD_TIMEOUT: 15m
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_KV_CACHE_TYPE: f16
    volumes:
      # Shared content-addressed weights, read-only for this serving process.
      - type: bind
        source: /mnt/ai-store/models/ollama
        target: /root/.ollama
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: [CMD, ollama, list]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  broker:
    name: 9950x-workhorse_default
    external: true
