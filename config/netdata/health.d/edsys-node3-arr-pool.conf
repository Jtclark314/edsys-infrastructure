# Install on pve-node3 only. ARR staging shares this thin pool with HA and the lab.
# The stock LVM metadata and data alerts remain enabled independently.
alarm: edsys_arr_nvme_pool_capacity
   on: lvm.lv_data_vg_pve_lv_data_space_utilization
class: Utilization
 type: System
component: LVM
 calc: $utilization
units: %
every: 1m
 warn: $this >= 75
 crit: $this >= 85
delay: down 5m
summary: EdCore NVMe pool needs capacity review
 info: Shared pve/data thin pool usage; preserve at least 100 GiB of free pool space for ARR, Home Assistant, and the isolated lab.
   to: sysadmin
