services:
  anythingllm:
    image: mintplexlabs/anythingllm@sha256:daf5a6ae9d363ed578e7d41e2d0668c7eaa604bd90b0ff27435f893b0906833e
    container_name: anythingllm
    restart: unless-stopped
    networks: [ai-net]
    ports:
      - "127.0.0.1:3002:3001"
      - "192.168.50.50:3002:3001"
    volumes:
      - /mnt/ai-store/anythingllm:/app/server/storage
      - /mnt/ai-store/rag/docs/EdSysVault_RAG:/obsidian:ro
      - /opt/edsys-rag-assist/releases/v1.1.0/provider.cjs:/app/server/utils/AiProviders/liteLLM/index.js:ro
      - /opt/edsys-rag-assist/releases/v1.1.0/assist.cjs:/app/server/utils/AiProviders/liteLLM/edsys-rag-assist.cjs:ro
      - /opt/edsys-rag-assist/releases/v1.1.0/upstream.cjs:/app/server/utils/AiProviders/liteLLM/edsys-upstream-litellm.cjs:ro
    env_file:
      - /etc/edsys-secrets/openai.env
      - /etc/edsys-secrets/anythingllm-litellm.env
    environment:
      STORAGE_DIR: /app/server/storage
      UID: "1000"
      GID: "1000"
      OLLAMA_BASE_PATH: http://ollama:11434
      OLLAMA_MODEL_PREF: ask-foothills-qwen35:latest

networks:
  ai-net:
    external: true
