services:
  anythingllm:
    image: mintplexlabs/anythingllm@sha256:00903f6311607b661d40f9e1d0e027d61e28a7b002ea9d1b7cad7763d26099f9
    container_name: anythingllm
    restart: unless-stopped
    networks: [ai-net]
    ports:
      - "127.0.0.1:3002:3001"
      - "192.168.50.50:3002:3001"
    volumes:
      - /mnt/ai-store/anythingllm:/app/server/storage
      - /mnt/ai-store/rag/docs/EdSysVault_RAG:/obsidian:ro
    env_file:
      - /etc/edsys-secrets/openai.env
      - /etc/edsys-secrets/anythingllm-litellm.env
    environment:
      STORAGE_DIR: /app/server/storage
      UID: "1000"
      GID: "1000"
      OLLAMA_BASE_PATH: http://ollama:11434
      OLLAMA_MODEL_PREF: ask-foothills-qwen35:latest

networks:
  ai-net:
    external: true
