name: edsys-voice-gateway

services:
  voice-gateway:
    image: ${EDSYS_VOICE_GATEWAY_IMAGE:?set an immutable image ID or registry digest in deploy.env}
    pull_policy: ${EDSYS_VOICE_GATEWAY_PULL_POLICY:-never}
    container_name: edsys-voice-gateway
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    cpus: 2.0
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,uid=10001,gid=10001,mode=0700
    env_file:
      - path: /etc/edsys-secrets/voice-gateway/gateway.env
        required: true
    ports:
      - "127.0.0.1:${EDSYS_VOICE_GATEWAY_PORT:-8055}:8443"
      - "127.0.0.1:${EDSYS_VOICE_GATEWAY_METRICS_PORT:-8056}:9101"
    volumes:
      - /etc/edsys-secrets/voice-gateway/tls:/run/edsys-voice-tls:ro
      - ./config/approved-workflows.json:/app/config/approved-workflows.json:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import json,ssl,urllib.request;
          c=ssl._create_unverified_context();
          d=json.load(urllib.request.urlopen('https://127.0.0.1:8443/health/live',context=c,timeout=3));
          assert d['status']=='live'
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging:
      driver: local
      options:
        max-size: 5m
        max-file: "3"
