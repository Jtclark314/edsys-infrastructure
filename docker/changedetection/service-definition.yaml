name: changedetection
description: Private website, PDF, price, stock, browser and visual change monitoring
host: 9950x
runtime: Three Docker Compose services; mount-guarded host startup
containers:
  - edsys-changedetection
  - edsys-changedetection-browser
  - edsys-changedetection-egress
images: images.lock.json
ports:
  - private_backend: 10.254.230.18:5000
    host_published: false
  - owner_proxy_https: 8453
networks:
  app: {subnet: 10.254.230.16/28, internal: true}
  browser: {subnet: 10.254.230.112/28, internal: true}
  egress: {subnet: 10.254.230.96/28, internal: false}
  gateway_ip_forwarding: false
volumes:
  - source: /mnt/ai-store/edsys-private-services/changedetection
    target: /datastore
    service: app
    purpose: Private settings, tokens, watches, processor settings and all history
environment:
  template: .env.example
  runtime: Private external env file; never committed
  timezone: America/New_York
  workers: 2
  browser_sessions: 3
  default_fetcher: html_requests
  telemetry: disabled
  private_target_addresses: Authorized through destination-checking proxy with explicit exclusions
  file_urls: blocked
  llm_features: Optional local model; new watches default off; CPU and concurrency bounded
secrets_required:
  - API and RSS tokens generated in the private datastore
  - Future explicitly selected target credentials and notification accounts remain private
backup:
  method: Stop app briefly; capture complete datastore; restart prior-running stack; encrypted offsite backup
  scope: Datastore, private env/access/MCP config, immutable app/browser image archives and matching source
  browser_and_gateway_state: Ephemeral; no durable host mounts
monitoring:
  app: Authenticated systeminfo response using private API token
  browser: Wrapper health and Chromium version
  gateway: Both private listeners and isolated network/forwarding configuration
  functional: Synthetic text/browser/visual changes, TLS/origin/egress checks and local AI CPU/unload proof
restore_notes: Restore matching cold datastore, pins and definitions into isolated networks; never share writable state
owner: Jeremy
last_verified: 2026-11-01 expanded isolated candidate; production and recovery acceptance owned by commissioning workflow
