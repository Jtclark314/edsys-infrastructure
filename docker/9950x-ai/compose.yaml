name: ai

services:
  ollama:
    image: ollama/ollama@sha256:910d0d8107b538fb0894e63163eb195de0cc7aefcbc666dc62d3b18f71124592
    container_name: ollama
    restart: unless-stopped
    networks: [ai-net]
    ports:
      - "127.0.0.1:11434:11434"
      - "192.168.50.50:11434:11434"
    environment:
      OLLAMA_HOST: 0.0.0.0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - /mnt/ai-store/models/ollama:/root/.ollama
      - /mnt/ai-store/cache:/root/.cache

  wyoming-openwakeword:
    image: rhasspy/wyoming-openwakeword@sha256:52cb1168731a1849fc28cf339c935fde58746bbabc94226668a40ef6ddf5d42b
    container_name: wyoming-openwakeword
    restart: unless-stopped
    networks: [ai-net]
    ports:
      - "127.0.0.1:10400:10400"
      - "192.168.50.50:10400:10400"
    command: >
      --preload-model hey_jarvis

  qdrant:
    image: qdrant/qdrant@sha256:9bfc89f9914fc14876a88c05270685921a55b8877b254a98bcc1cc2f0a424cd2
    container_name: qdrant
    restart: unless-stopped
    networks: [ai-net]
    ports:
      - "127.0.0.1:6333:6333"
      - "192.168.50.50:6333:6333"
    volumes:
      - /mnt/ai-store/qdrant:/qdrant/storage

  infinity:
    image: ghcr.io/michaelfeil/infinity_v3@sha256:b4d29fc70afc024fa430eae05ac11e074e736dd3fc13d756090479fcfa2460e3
    container_name: infinity
    restart: unless-stopped
    networks: [ai-net]
    ports:
      - "127.0.0.1:7997:7997"
      - "192.168.50.50:7997:7997"
    volumes:
      - /mnt/ai-store/infinity:/app/.cache:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command:
      - --hostname
      - 0.0.0.0
      - --port
      - "7997"
      - --model-id
      - /app/.cache/huggingface/hub/models--michaelfeil--bge-small-en-v1.5/snapshots/ab7b31bd10f9bfbb915a28662ec4726b06c6552a
      - --served-model-name
      - michaelfeil/bge-small-en-v1.5
      - --torch-device
      - cuda
      - --device-id
      - "0"
      - --dtype
      - float16
      - --tokenization-workers
      - "2"
      - --max-batch-tokens
      - "8192"
      - --max-sequence-length
      - "512"
      - --max-client-batch-size
      - "512"

  whisper:
    image: rhasspy/wyoming-whisper@sha256:ba6fcb6056ebe237d15a325381763a80af2fc8fcedaa04f6a714a7375eb20d80
    container_name: whisper
    restart: unless-stopped
    networks: [ai-net]
    ports:
      - "127.0.0.1:10300:10300"
      - "192.168.50.50:10300:10300"
    volumes:
      - /mnt/ai-store/whisper/data:/data
    environment:
      HF_HUB_OFFLINE: "1"
    command: >
      --model base --language en --uri tcp://0.0.0.0:10300

  piper:
    image: rhasspy/wyoming-piper@sha256:0f4598a8f8a984275f67c066d7cd96d26ef2601947d0372b8f32c82ae18fb7cd
    container_name: piper
    restart: unless-stopped
    networks: [ai-net]
    ports:
      - "127.0.0.1:10200:10200"
      - "192.168.50.50:10200:10200"
    volumes:
      - /mnt/ai-store/piper/data:/data
    command: >
      --voice en_US-lessac-medium --uri tcp://0.0.0.0:10200

networks:
  ai-net:
    external: true
