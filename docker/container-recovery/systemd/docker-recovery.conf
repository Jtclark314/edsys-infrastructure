[Unit]
RequiresMountsFor=/mnt/data-500g /mnt/ai-store

[Service]
# Prevent existing auto-restart containers from opening a root-filesystem fallback.
ExecStartPre=/usr/bin/mountpoint -q /mnt/data-500g
ExecStartPre=/usr/bin/mountpoint -q /mnt/ai-store
ExecStartPost=/usr/bin/systemctl --no-block start edsys-container-recovery.service
TimeoutStopSec=3min
