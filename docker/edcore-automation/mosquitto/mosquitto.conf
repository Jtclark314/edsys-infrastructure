persistence true
persistence_location /mosquitto/data/
autosave_interval 300
autosave_on_changes false

# Global by Mosquitto design. Retained HA/Frigate discovery and state remain
# supported. Command non-retention is enforced by exclusive command-topic ACL
# ownership plus the reviewed runtime's hard-coded retain=false behavior and
# retained-request rejection, then exercised across broker restart acceptance.
retain_available true

max_keepalive 300
max_inflight_messages 20
max_queued_messages 1000
message_size_limit 262144
max_packet_size 262144
set_tcp_nodelay true
sys_interval 60

connection_messages true
log_dest stdout
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S
log_type error
log_type warning
log_type notice
log_type information

per_listener_settings true

# LAN-facing event/discovery listener. Retained state and Home Assistant /
# Frigate discovery remain available during migration. Its ACL contains no
# production command writer and no automation/request writer.
listener 8883 0.0.0.0
protocol mqtt
allow_anonymous false
allow_zero_length_clientid false
require_certificate true
use_identity_as_username true
cafile /run/secrets/automation_ca_cert
certfile /run/secrets/mosquitto_server_cert
keyfile /run/secrets/mosquitto_server_key
tls_version tlsv1.2
acl_file /mosquitto/config/aclfile

# Compose-internal command path. This port is never published on the guest.
# Node-RED can submit requests and the bounded runtime alone can publish final
# HA commands. The runtime rejects retained requests before validation.
listener 8884 0.0.0.0
protocol mqtt
allow_anonymous false
allow_zero_length_clientid false
require_certificate true
use_identity_as_username true
cafile /run/secrets/automation_ca_cert
certfile /run/secrets/mosquitto_server_cert
keyfile /run/secrets/mosquitto_server_key
tls_version tlsv1.2
acl_file /mosquitto/config/aclfile-internal
