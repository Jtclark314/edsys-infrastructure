[agent]
  interval = "10s"
  round_interval = true
  metric_batch_size = 250
  metric_buffer_limit = 2000
  collection_jitter = "1s"
  flush_interval = "10s"
  flush_jitter = "2s"
  precision = "1s"
  debug = false
  quiet = false
  hostname = "edcore-automation"
  omit_hostname = false
  skip_processors_after_aggregators = true

# Environmental and energy telemetry is selected explicitly and preserved at
# source cadence. This is analytics history, not a replacement for HA Recorder.
[[inputs.mqtt_consumer]]
  servers = ["ssl://mosquitto:8883"]
  topics = [
    "edsys/v1/telemetry/environment/#",
    "edsys/v1/telemetry/energy/#",
  ]
  qos = 1
  client_id = "telegraf-selected"
  persistent_session = false
  connection_timeout = "10s"
  keepalive = "60s"
  max_undelivered_messages = 250
  name_override = "selected_telemetry"
  data_format = "json_v2"
  tls_ca = "/run/secrets/automation_ca_cert"
  tls_cert = "/run/secrets/mqtt_client_cert"
  tls_key = "/run/secrets/mqtt_client_key"
  tls_server_name = "mosquitto"
  insecure_skip_verify = false
  [[inputs.mqtt_consumer.json_v2]]
    measurement_name = "selected_telemetry"
    timestamp_path = "ts"
    timestamp_format = "2006-01-02T15:04:05.999999999Z07:00"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "value"
      rename = "value"
      type = "float"

# RF and explicitly labeled high-rate streams are aggregated before storage.
[[inputs.mqtt_consumer]]
  servers = ["ssl://mosquitto:8883"]
  topics = [
    "edsys/v1/telemetry/rf/#",
    "edsys/v1/telemetry/highrate/#",
  ]
  qos = 1
  client_id = "telegraf-highrate"
  persistent_session = false
  connection_timeout = "10s"
  keepalive = "60s"
  max_undelivered_messages = 250
  name_override = "highrate_telemetry"
  data_format = "json_v2"
  tls_ca = "/run/secrets/automation_ca_cert"
  tls_cert = "/run/secrets/mqtt_client_cert"
  tls_key = "/run/secrets/mqtt_client_key"
  tls_server_name = "mosquitto"
  insecure_skip_verify = false
  [[inputs.mqtt_consumer.json_v2]]
    measurement_name = "highrate_telemetry"
    timestamp_path = "ts"
    timestamp_format = "2006-01-02T15:04:05.999999999Z07:00"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "value"
      rename = "value"
      type = "float"

[[aggregators.basicstats]]
  period = "10s"
  delay = "2s"
  grace = "2s"
  drop_original = true
  # With no producer-controlled tags, these are exactly two fixed series and
  # output is bounded to one aggregate per measurement per ten-second period.
  namepass = ["selected_telemetry", "highrate_telemetry"]
  fieldinclude = ["value"]
  stats = ["count", "min", "max", "mean", "stdev"]

[[outputs.influxdb_v2]]
  urls = ["https://influxdb:8086"]
  token = "${INFLUX_TOKEN}"
  organization = "${INFLUX_ORG}"
  bucket = "${INFLUX_BUCKET}"
  timeout = "10s"
  tls_ca = "/run/secrets/automation_ca_cert"
  tls_server_name = "influxdb"
  insecure_skip_verify = false
