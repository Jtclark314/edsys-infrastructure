services:
  schedule-procurement:
    build:
      context: ${FOOTHILLS_PORTAL_REPO:-/home/jeremy/code/foothills-project-portal}/schedule-procurement
      dockerfile: Dockerfile
    image: foothills-schedule-procurement:${SCHEDULE_PROCUREMENT_IMAGE_TAG:-local}
    container_name: foothills-schedule-procurement
    network_mode: bridge
    restart: unless-stopped
    init: true
    user: "${SCHEDULE_PROCUREMENT_UID:-1000}:${SCHEDULE_PROCUREMENT_GID:-1000}"
    env_file:
      - ${SCHEDULE_PROCUREMENT_ENV_FILE:-/etc/edsys/schedule-procurement.env}
    environment:
      SCHEDULE_PROCUREMENT_DATA_DIR: /var/lib/foothills-schedule-procurement
      SCHEDULE_PROCUREMENT_FRONTEND: /app/frontend-dist
    ports:
      - "${SCHEDULE_PROCUREMENT_LAN_BIND_ADDRESS:-192.168.50.50}:3037:3037"
      - "${SCHEDULE_PROCUREMENT_TAILNET_BIND_ADDRESS:-100.87.137.47}:3037:3037"
    volumes:
      - ${SCHEDULE_PROCUREMENT_DATA_DIR:-/mnt/ai-store/foothills-schedule-procurement}:/var/lib/foothills-schedule-procurement:rw
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json,urllib.request; payload=json.load(urllib.request.urlopen('http://127.0.0.1:3037/readyz',timeout=10)); assert payload['ready']"
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
