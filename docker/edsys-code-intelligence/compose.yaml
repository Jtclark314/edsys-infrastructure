name: edsys-code-intelligence

x-security: &default-security
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

x-logging: &bounded-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

x-labels: &managed-labels
  com.edsys.managed: "true"
  com.edsys.preserve: "true"
  com.edsys.service: edsys-code-intelligence

services:
  zoekt-search:
    build:
      context: ./images/zoekt
      dockerfile: Dockerfile
    image: edsys/zoekt-minimal:2cb19912-go1.26.5
    pull_policy: never
    container_name: edsys-code-search
    restart: unless-stopped
    <<: *default-security
    user: "100:101"
    init: true
    command:
      - zoekt-webserver
      - -index
      - /data/index
      - -listen
      - :6070
      - -html=false
      - -rpc=true
      - -pprof=false
      - -print=false
    volumes:
      - ${CODE_INTELLIGENCE_STATE_ROOT:-/mnt/ai-store/codex-intelligence}/zoekt:/data/index:ro
    networks:
      - code-intelligence-internal
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    cpus: 8.0
    mem_limit: 8g
    mem_reservation: 256m
    pids_limit: 256
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - /usr/local/bin/zoekt-healthcheck
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging: *bounded-logging
    labels: *managed-labels

  onnx-rerank-cpu:
    build:
      context: ${CODE_INTELLIGENCE_APP_ROOT:-/home/jeremy/code/edsys-code-intelligence}
      dockerfile: Dockerfile
      target: reranker
    image: edsys/code-intelligence-reranker:0.1.0
    pull_policy: never
    container_name: edsys-code-reranker
    restart: unless-stopped
    <<: *default-security
    user: "10001:10001"
    init: true
    environment:
      HOME: /tmp
      XDG_CACHE_HOME: /tmp/cache
      RERANK_MODEL_ROOT: /models/reranker
      RERANK_MODEL_NAME: ms-marco-MiniLM-L6-v2-cpu
      RERANK_MODEL_SHA256: 3573b6b9593cb2f75987a31815d409ca3dd8808629118fd20451bb1a5d90cec7
      RERANK_THREADS: "12"
      RERANK_BATCH_SIZE: "16"
      RERANK_HOST: 0.0.0.0
      RERANK_PORT: "7998"
      RERANK_LOG_LEVEL: WARNING
    volumes:
      - ${CODE_INTELLIGENCE_RERANK_MODEL_ROOT:-/mnt/ai-store/codex-intelligence/models/ms-marco-MiniLM-L6-v2-c5ee24cb}:/models/reranker:ro
    networks:
      - code-intelligence-internal
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    cpus: 12.0
    mem_limit: 2g
    mem_reservation: 256m
    pids_limit: 128
    stop_grace_period: 45s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import json,urllib.request;
          data=json.load(urllib.request.urlopen('http://127.0.0.1:7998/models',timeout=3));
          assert any('rerank' in m.get('capabilities',[]) for m in data.get('data',[]))
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 45s
    logging: *bounded-logging
    labels: *managed-labels

  code-intelligence-mcp:
    build:
      context: ${CODE_INTELLIGENCE_APP_ROOT:-/home/jeremy/code/edsys-code-intelligence}
      dockerfile: Dockerfile
      target: mcp
    image: edsys/code-intelligence-mcp:local
    container_name: edsys-code-intelligence-mcp
    restart: unless-stopped
    <<: *default-security
    user: "10001:10001"
    init: true
    depends_on:
      zoekt-search:
        condition: service_healthy
      onnx-rerank-cpu:
        condition: service_started
    ports:
      - 127.0.0.1:${CODE_INTELLIGENCE_MCP_PORT:-6071}:6071
    environment:
      CODE_INTELLIGENCE_HOST: 0.0.0.0
      CODE_INTELLIGENCE_PORT: "6071"
      CODE_INTELLIGENCE_REPOSITORY_CATALOG_PATH: /config/repositories.json
      CODE_INTELLIGENCE_INDEX_STATUS_PATH: /state/index-status.json
      CODE_INTELLIGENCE_ZOEKT_URL: http://zoekt-search:6070
      CODE_INTELLIGENCE_RERANK_URL: http://onnx-rerank-cpu:7998
      CODE_INTELLIGENCE_RERANK_MODEL: ms-marco-MiniLM-L6-v2-cpu
      CODE_INTELLIGENCE_OLLAMA_URL: http://ollama:11434
      CODE_INTELLIGENCE_OLLAMA_MODEL: qwen2.5-coder:32b
      CODE_INTELLIGENCE_SEARCH_TIMEOUT_SECONDS: "8"
      CODE_INTELLIGENCE_RERANK_TIMEOUT_SECONDS: "20"
      CODE_INTELLIGENCE_REVIEW_TIMEOUT_SECONDS: "300"
      CODE_INTELLIGENCE_REVIEW_BUSY_TIMEOUT_SECONDS: "2"
      CODE_INTELLIGENCE_OLLAMA_NUM_CTX: "32768"
      CODE_INTELLIGENCE_OLLAMA_NUM_THREAD: "24"
      CODE_INTELLIGENCE_OLLAMA_NUM_PREDICT: "2048"
      CODE_INTELLIGENCE_OLLAMA_KEEP_ALIVE: 5m
    volumes:
      - ./repositories.json:/config/repositories.json:ro
      - ${CODE_INTELLIGENCE_STATE_ROOT:-/mnt/ai-store/codex-intelligence}/state:/state:ro
    networks:
      - code-intelligence-internal
      - ai-net
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m,mode=1777
    cpus: 4.0
    mem_limit: 2g
    mem_reservation: 128m
    pids_limit: 128
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import json,urllib.request;
          data=json.load(urllib.request.urlopen('http://127.0.0.1:6071/ready',timeout=5));
          assert data.get('core_ready') is True
      interval: 20s
      timeout: 8s
      retries: 10
      start_period: 30s
    logging: *bounded-logging
    labels: *managed-labels

networks:
  code-intelligence-internal:
    name: edsys-code-intelligence-internal
    internal: true
  ai-net:
    external: true
